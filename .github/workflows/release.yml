name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      node-version: "26.x"
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: pnpm install
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # v2 is the action's development branch, so pin a release
        uses: changesets/action@v2.1.2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: pnpm release-packages
        env:
          # pnpm publishes through trusted publishing (OIDC) and falls back to this token
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload swagger to http-apis if released
        if: steps.changesets.outputs.published == 'true'
        uses: "actions/github-script@v7"
        with:
          script: |
            const script = require('.github/workflows/upload-swagger.js')
            const fs = require('node:fs')
            await script({ github }, ${{ steps.changesets.outputs.published-packages }}, fs)
